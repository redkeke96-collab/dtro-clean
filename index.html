<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0054A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="10초 청렴 챌린지">
<link rel="manifest" href="manifest.json">
<title>10초 청렴 챌린지</title>
<style>
:root{
  --dtro:#0054A6;--dtro2:#0C63CE;--dark:#073D79;--yellow:#FFD43B;
  --red:#E63A36;--bg:#EEF4FA;--text:#182033;--muted:#6E7890;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#dfe7f1;color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100dvh;background:linear-gradient(145deg,var(--dtro),var(--dark));overflow:hidden}
.page{position:absolute;inset:0;display:none}.page.active{display:flex}

/* START */
.start-page{flex-direction:column;color:#fff;padding:calc(18px + env(safe-area-inset-top)) clamp(18px,3vw,40px) calc(18px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;font-size:clamp(16px,1.8vw,22px);font-weight:900}
.logo{background:#fff;color:var(--dtro);font-weight:1000;padding:6px 10px;border-radius:9px}
.top-reset{
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.10);
  color:#fff;border-radius:999px;
  padding:7px 11px;font-size:12px;font-weight:900;
  cursor:pointer;
}
.top-reset:active{background:rgba(255,255,255,.22)}
.start-main{flex:1;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:clamp(20px,4vw,60px)}
.copy{display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:clamp(18px,2vw,28px);font-weight:900;color:#dceaff}
.title{font-size:clamp(64px,8vw,112px);line-height:.92;margin:10px 0 0;font-weight:1000;letter-spacing:-.07em}
.title .ten{display:block;color:var(--yellow)}
.subtitle{font-size:clamp(24px,3vw,40px);font-weight:1000;margin-top:18px}
.desc{font-size:clamp(14px,1.5vw,20px);color:#dceaff;margin-top:8px}
.side{display:flex;flex-direction:column;align-items:center;gap:18px}
.mascot-start{height:min(32vh,260px);object-fit:contain;filter:drop-shadow(0 14px 20px rgba(0,0,0,.18))}
.start-btn{width:100%;max-width:520px;height:clamp(82px,11vh,110px);border:0;border-radius:24px;background:var(--yellow);color:#08346D;font-size:clamp(40px,5vw,62px);font-weight:1000;box-shadow:0 10px 0 rgba(0,0,0,.13),0 18px 34px rgba(0,0,0,.18)}
.start-note{font-size:clamp(12px,1.3vw,16px);color:#dceaff;text-align:center}
.start-stats{
  width:100%;max-width:520px;background:#fff;color:var(--text);
  border-radius:20px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.14)
}
.start-stats-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:1000;color:#31415e;margin-bottom:10px
}
.start-stats-head small{font-size:11px;color:#8a96aa;font-weight:700}
.start-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start-stat{
  border-radius:15px;padding:12px 8px;text-align:center;
  background:#eef5ff;border:1px solid #d6e5fb;color:#164b93
}
.start-stat.perfect{background:#fff8df;border-color:#f4dfa1;color:#7b5b00}
.start-stat span{display:block;font-size:12px;font-weight:900;margin-bottom:3px}
.start-stat b{font-size:clamp(24px,3vw,36px);font-weight:1000}

/* QUIZ */
.quiz-page{flex-direction:column;background:linear-gradient(180deg,var(--dtro) 0 20%,#eef4fa 20% 100%)}
.quiz-head{height:20%;min-height:105px;color:#fff;padding:calc(14px + env(safe-area-inset-top)) clamp(18px,3vw,36px) 12px;display:flex;flex-direction:column;justify-content:center}
.head-top{display:flex;align-items:center;justify-content:space-between}
.head-title{font-size:clamp(24px,3vw,40px);font-weight:1000}
.timer{border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:7px 14px;font-size:clamp(20px,2.5vw,30px);font-weight:1000;min-width:90px;text-align:center}
.progress-wrap{height:7px;background:rgba(255,255,255,.24);border-radius:10px;margin-top:12px;overflow:hidden}
.progress{height:100%;width:100%;background:var(--yellow)}
.quiz-card{flex:1;margin:0 clamp(14px,2.5vw,34px) clamp(14px,2.5vw,30px);background:#fff;border-radius:26px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,40,90,.18);min-height:0}
.qmeta{display:flex;align-items:center;justify-content:space-between}
.qbadge{background:var(--dtro);color:#fff;border-radius:999px;padding:7px 14px;font-size:clamp(16px,1.8vw,22px);font-weight:1000}
.qnum{font-size:clamp(18px,2vw,24px);color:var(--dtro);font-weight:1000}
.question-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 5%}
.question{text-align:center;font-size:clamp(30px,4.1vw,56px);font-weight:1000;line-height:1.3;letter-spacing:-.04em}
.hint{text-align:center;color:var(--muted);font-size:clamp(13px,1.5vw,18px);font-weight:800;margin-bottom:10px}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,24px);height:clamp(150px,23vh,220px)}
.answer{border:0;border-radius:26px;color:#fff;font-size:clamp(70px,9vw,120px);font-weight:1000;box-shadow:0 10px 20px rgba(0,0,0,.13)}
.o{background:linear-gradient(145deg,#0D67D5,#004CA4)}
.x{background:linear-gradient(145deg,#F34642,#C8221F)}
.tagu-corner{position:absolute;right:clamp(8px,1.8vw,24px);bottom:clamp(6px,1.2vw,16px);height:clamp(90px,15vh,150px);pointer-events:none;z-index:5}

/* RESULT */
.result-page{flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
.result-content{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(20px,4vw,60px);align-items:center;width:min(1100px,100%)}
.result-mascot{height:min(42vh,320px);object-fit:contain}
.result-score{font-size:clamp(90px,12vw,160px);line-height:1;font-weight:1000;color:var(--yellow)}
.result-title{font-size:clamp(42px,6vw,80px);font-weight:1000}
.result-msg{font-size:clamp(18px,2vw,28px);color:#dceaff;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.stat{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);padding:18px;border-radius:18px;color:#dceaff}
.stat b{display:block;font-size:clamp(28px,4vw,50px);color:#fff;margin-top:5px}

/* FEEDBACK */
.feedback,.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(7,25,52,.92);color:#fff;text-align:center}
.feedback.show,.countdown.show{display:flex}
.feedback-inner{font-size:clamp(58px,8vw,110px);font-weight:1000}
.feedback-inner small{display:block;font-size:clamp(20px,2.5vw,30px);margin-top:16px;color:#e8f0fb}
.countdown{font-size:clamp(120px,20vw,240px);font-weight:1000}

/* ADMIN */
.admin-hot{position:absolute;right:5px;bottom:5px;width:40px;height:40px;border:0;background:transparent;z-index:60}
.admin-panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,16,34,.96);z-index:70;padding:22px;color:#fff}
.admin-panel.show{display:flex}
.admin-card{width:min(430px,100%);background:#10284a;border-radius:22px;padding:24px}
.admin-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.admin-actions button{border:0;border-radius:13px;padding:14px;font-weight:900}.reset{background:#ef4541;color:#fff}.close{background:#fff;color:#10284a}

/* PORTRAIT */
@media (orientation:portrait){
  .start-main{grid-template-columns:1fr;gap:10px}
  .copy{text-align:center;align-items:center}
  .kicker{font-size:18px}.title{font-size:clamp(58px,17vw,92px)}.subtitle{font-size:clamp(24px,7vw,34px)}
  .mascot-start{height:min(18vh,150px)}
  .start-btn{height:70px;font-size:36px}
  .start-stats{padding:10px;border-radius:16px}
  .start-stats-grid{gap:7px}
  .start-stat{padding:8px 5px}
  .start-stat b{font-size:25px}
  .quiz-page{background:linear-gradient(180deg,var(--dtro) 0 16%,#eef4fa 16% 100%)}
  .quiz-head{height:16%;min-height:92px;padding-top:calc(10px + env(safe-area-inset-top))}
  .head-title{font-size:22px}.timer{font-size:20px;min-width:76px;padding:5px 10px}
  .quiz-card{
    margin:0 10px 10px;border-radius:20px;padding:12px;min-height:0;
    justify-content:flex-start;
  }
  .qbadge{font-size:14px;padding:6px 10px}.qnum{font-size:16px}
  .question-wrap{
    flex:0 1 auto;
    min-height:150px;
    max-height:31vh;
    padding:8px 2% 2px;
  }
  .question{font-size:clamp(24px,6.3vw,33px);line-height:1.25}
  .hint{font-size:12px;margin:2px 0 8px}
  .answer-grid{
    height:138px;
    min-height:138px;
    gap:10px;
    margin-top:0;
  }
  .answer{font-size:66px;border-radius:20px}
  .tagu-corner{height:68px;right:5px;bottom:4px}
  .result-content{grid-template-columns:1fr;gap:8px}
  .result-mascot{height:min(27vh,190px)}
  .result-score{font-size:90px}.result-title{font-size:44px}
  .stats{margin-top:12px}
}
@media (max-height:650px) and (orientation:landscape){
  .quiz-head{height:18%;min-height:88px}
  .quiz-page{background:linear-gradient(180deg,var(--dtro) 0 18%,#eef4fa 18% 100%)}
  .quiz-card{padding:14px 20px;margin-bottom:12px}
  .question{font-size:34px}.answer-grid{height:140px}.answer{font-size:72px}
  .hint{margin-bottom:5px}.tagu-corner{height:90px}
}

@media (orientation:portrait) and (max-height:750px){
  .quiz-head{height:14%;min-height:78px}
  .quiz-page{background:linear-gradient(180deg,var(--dtro) 0 14%,#eef4fa 14% 100%)}
  .quiz-card{padding:10px;margin-bottom:8px}
  .question-wrap{min-height:120px;max-height:27vh;padding-top:4px}
  .question{font-size:clamp(22px,5.9vw,30px)}
  .answer-grid{height:120px;min-height:120px}
  .answer{font-size:60px}
  .hint{margin:0 0 6px}
  .tagu-corner{height:58px}
}


@media (orientation:portrait) and (max-height:780px){
  .start-page{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .start-main{gap:6px}
  .kicker{font-size:15px}
  .title{font-size:clamp(48px,14vw,72px);margin-top:5px}
  .subtitle{font-size:22px;margin-top:8px}
  .desc{font-size:12px;margin-top:4px}
  .mascot-start{height:12vh;min-height:80px}
  .side{gap:8px}
  .start-stats{padding:8px}
  .start-stats-head{margin-bottom:6px;font-size:12px}
  .start-stat{padding:6px 4px}
  .start-stat span{font-size:10px}
  .start-stat b{font-size:22px}
  .start-btn{height:58px;font-size:31px;border-radius:18px}
  .start-note{font-size:11px}
}

</style>
</head>
<body>
<div class="app">

<section id="startPage" class="page start-page active">
  <div class="brand">
      <div><span class="logo">DTRO</span><span style="margin-left:10px">대구교통공사</span></div>
      <button id="startReset" class="top-reset" title="참여기록 초기화">↻ 리셋</button>
    </div>
  <div class="start-main">
    <div class="copy">
      <div class="kicker">출근길 10초 도전!</div>
      <h1 class="title"><span class="ten">10초</span>청렴 챌린지</h1>
      <div class="subtitle">3문제 OX 퀴즈</div>
      <div class="desc">20개 문제 중 랜덤 3문제를 10초 안에 풀어보세요.</div>
    </div>
    <div class="side">
      <img src="tagu.png" class="mascot-start" alt="대구교통공사 타구 캐릭터">

      <div class="start-stats">
        <div class="start-stats-head">
          <span>👥 참여 현황</span>
          <small>이 기기 누적</small>
        </div>
        <div class="start-stats-grid">
          <div class="start-stat">
            <span>참여자 수</span>
            <b id="startPlayers">0명</b>
          </div>
          <div class="start-stat perfect">
            <span>🏆 PERFECT</span>
            <b id="startPerfects">0회</b>
          </div>
        </div>
      </div>

      <button id="startBtn" class="start-btn">START</button>
      <div class="start-note">청렴한 당신, 대구교통공사의 자랑입니다!<br><span id="offlineStatus" style="font-size:11px;opacity:.85">오프라인 준비 중...</span></div>
    </div>
  </div>
</section>

<section id="quizPage" class="page quiz-page">
  <div class="quiz-head">
    <div class="head-top">
      <div class="head-title">10초 청렴 챌린지</div>
      <div id="timer" class="timer">10.0</div>
    </div>
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
  </div>
  <div class="quiz-card">
    <div class="qmeta">
      <div id="qbadge" class="qbadge">문제 1 / 3</div>
      <div id="qnum" class="qnum">Q1</div>
    </div>
    <div class="question-wrap"><div id="question" class="question"></div></div>
    <div class="hint">💡 잠깐 고민하고 선택하세요!</div>
    <div class="answer-grid">
      <button id="btnO" class="answer o">O</button>
      <button id="btnX" class="answer x">X</button>
    </div>
  </div>
  <img src="tagu.png" class="tagu-corner" alt="">
</section>

<section id="resultPage" class="page result-page">
  <div class="result-content">
    <img src="tagu.png" class="result-mascot" alt="대구교통공사 타구 캐릭터">
    <div>
      <div id="resultScore" class="result-score">3/3</div>
      <div id="resultTitle" class="result-title">PERFECT!</div>
      <div id="resultMsg" class="result-msg">청렴한 당신, 최고입니다!</div>
      <div class="stats">
        <div class="stat">참가자<b id="players">0명</b></div>
        <div class="stat">PERFECT<b id="perfects">0명</b></div>
      </div>
    </div>
  </div>
</section>

<div id="feedback" class="feedback"><div id="feedbackInner" class="feedback-inner"></div></div>
<div id="countdown" class="countdown"></div>

<button id="adminHot" class="admin-hot" aria-label="관리자"></button>
<div id="adminPanel" class="admin-panel">
  <div class="admin-card">
    <h2>관리자 메뉴</h2>
    <div class="admin-row"><span>누적 참가자</span><b id="adminPlayers">0명</b></div>
    <div class="admin-row"><span>PERFECT</span><b id="adminPerfects">0명</b></div>
    <div class="admin-actions">
      <button id="resetStats" class="reset">통계 초기화</button>
      <button id="closeAdmin" class="close">닫기</button>
    </div>
  </div>
</div>

</div>
<script>
const BANK=[
{q:"직무관련자가 주는 선물은 금액이 적으면 무조건 받을 수 있다.",a:"X"},
{q:"공직자는 직무와 관련하여 사적 이해관계가 있는 경우 신고해야 할 수 있다.",a:"O"},
{q:"업무상 알게 된 비밀이나 정보를 개인의 이익을 위해 이용해서는 안 된다.",a:"O"},
{q:"친한 지인의 부탁이라도 법령을 위반하여 업무를 처리해 달라는 부탁은 부정청탁이 될 수 있다.",a:"O"},
{q:"부정청탁을 받았더라도 실제로 업무를 처리해 주지 않았다면 아무런 조치가 필요 없다.",a:"X"},
{q:"공직자가 직무관련자로부터 금품을 받는 것은 금액과 관계없이 문제가 될 수 있다.",a:"O"},
{q:"음식물·선물·경조사비에는 청탁금지법상 허용되는 가액기준이 있다.",a:"O"},
{q:"업무와 관계없는 친구가 공직자에게 주는 모든 선물은 청탁금지법상 금지된다.",a:"X"},
{q:"공직자는 가족과 관련된 사적 이해관계로 공정한 직무수행이 어려울 수 있는 경우 이해충돌 여부를 살펴야 한다.",a:"O"},
{q:"직무관련 업체의 대표와 개인적으로 친하면 업무상 편의를 제공해도 된다.",a:"X"},
{q:"공직자는 공공기관의 물품이나 차량 등을 사적인 용도로 사용해서는 안 된다.",a:"O"},
{q:"상급자의 지시라면 명백하게 부당한 지시도 반드시 따라야 한다.",a:"X"},
{q:"공직자는 직위를 이용하여 다른 직원에게 사적인 일을 시켜서는 안 된다.",a:"O"},
{q:"부하직원에게 개인적인 심부름을 반복적으로 시키는 것은 갑질 문제가 될 수 있다.",a:"O"},
{q:"공직자가 자신의 직무상 권한을 이용해 가족이나 지인에게 특혜를 주는 것은 문제가 될 수 있다.",a:"O"},
{q:"업무처리 과정에서 특정 업체에만 유리한 정보를 미리 알려줘도 금품을 받지 않았다면 문제없다.",a:"X"},
{q:"직무관련자가 비용을 대신 내준 식사는 내가 직접 돈을 받은 것이 아니므로 금품수수와 관계없다.",a:"X"},
{q:"공직자가 민원인의 정상적인 민원이나 문의를 듣는 것 자체가 부정청탁에 해당한다.",a:"X"},
{q:"공정한 직무수행을 위해 이해충돌이 의심되는 상황은 사전에 신고·상담하는 것이 바람직하다.",a:"O"},
{q:"청렴은 금품을 받지 않는 것뿐만 아니라 공정한 업무처리와 이해충돌 방지도 포함한다.",a:"O"}];

const DISPLAY_TOTAL=10;
const REAL_DURATION=15;
let picked=[],idx=0,score=0,startAt=0,timerId=null,locked=false,timedOut=false;
const $=id=>document.getElementById(id);
function showPage(id){["startPage","quizPage","resultPage"].forEach(x=>$(x).classList.toggle("active",x===id))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function stats(){
 const p=+(localStorage.getItem("players")||0),f=+(localStorage.getItem("perfects")||0);
 $("players").textContent=p+"명";$("perfects").textContent=f+"명";
 $("startPlayers").textContent=p+"명";$("startPerfects").textContent=f+"회";
 $("adminPlayers").textContent=p+"명";$("adminPerfects").textContent=f+"명";
}
function save(){
 let p=+(localStorage.getItem("players")||0),f=+(localStorage.getItem("perfects")||0);
 p++;if(score===3)f++;
 localStorage.setItem("players",p);localStorage.setItem("perfects",f);stats();
}
async function countdown(){
 $("countdown").classList.add("show");
 for(const n of ["3","2","1","GO!"]){
   $("countdown").textContent=n;
   await new Promise(r=>setTimeout(r,n==="GO!"?300:400));
 }
 $("countdown").classList.remove("show");begin();
}
function begin(){
 picked=shuffle(BANK).slice(0,3);idx=0;score=0;locked=false;timedOut=false;startAt=performance.now();
 showPage("quizPage");render();clearInterval(timerId);timerId=setInterval(tick,50);
}
function render(){
 $("qbadge").textContent=`문제 ${idx+1} / 3`;$("qnum").textContent=`Q${idx+1}`;$("question").textContent=picked[idx].q;
}
function tick(){
 const elapsed=(performance.now()-startAt)/1000;
 const ratio=Math.min(1,elapsed/REAL_DURATION);
 const displayLeft=Math.max(0,DISPLAY_TOTAL*(1-ratio));
 $("timer").textContent=displayLeft.toFixed(1);
 $("progress").style.width=((1-ratio)*100)+"%";
 if(elapsed>=REAL_DURATION){clearInterval(timerId);timedOut=true;finish();}
}
function answer(v){
 if(locked||timedOut)return;locked=true;
 const ok=v===picked[idx].a;if(ok)score++;
 $("feedbackInner").innerHTML=ok?`✅<br>정답!<small>좋습니다.</small>`:`❌<br>아쉽습니다!<small>정답은 ${picked[idx].a}</small>`;
 $("feedback").classList.add("show");
 setTimeout(()=>{
   $("feedback").classList.remove("show");idx++;
   if(idx>=3){clearInterval(timerId);finish()}else{render();locked=false}
 },460);
}
function finish(){
 clearInterval(timerId);showPage("resultPage");$("resultScore").textContent=`${score}/3`;
 if(score===3){$("resultTitle").textContent="PERFECT!";$("resultMsg").textContent="청렴한 당신, 최고입니다!"}
 else if(score===2){$("resultTitle").textContent="GOOD!";$("resultMsg").textContent="좋습니다! 한 문제만 더!"}
 else{$("resultTitle").textContent="CHALLENGE!";$("resultMsg").textContent=timedOut?"10초 종료! 다음 도전자에게 기회를!":"오늘도 청렴하게!"}
 save();setTimeout(reset,2300);
}
function reset(){
 $("timer").textContent="10.0";$("progress").style.width="100%";locked=false;timedOut=false;showPage("startPage");
}
$("startBtn").onclick=countdown;
$("startReset").onclick=()=>{
  if(confirm("참여자 수와 PERFECT 기록을 0으로 초기화할까요?")){
    localStorage.setItem("players","0");
    localStorage.setItem("perfects","0");
    stats();
  }
};
$("btnO").onclick=()=>answer("O");$("btnX").onclick=()=>answer("X");
$("adminHot").onclick=()=>{$("adminPanel").classList.add("show");stats()};
$("closeAdmin").onclick=()=>$("adminPanel").classList.remove("show");
$("resetStats").onclick=()=>{localStorage.setItem("players","0");localStorage.setItem("perfects","0");stats()};
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
stats();
if("serviceWorker" in navigator){
  window.addEventListener("load", async ()=>{
    const status=document.getElementById("offlineStatus");
    const setStatus=(txt)=>{ if(status) status.textContent=txt; };

    try{
      setStatus("오프라인 준비 중...");

      const reg = await Promise.race([
        navigator.serviceWorker.register("./service-worker.js"),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("등록 시간 초과")),5000))
      ]);

      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("활성화 시간 초과")),5000))
      ]);

      // First install may not control current page until reload.
      if(!navigator.serviceWorker.controller){
        setStatus("✓ 설치 완료 · 한 번 새로고침하면 오프라인 준비 완료");
        return;
      }

      const check = () => navigator.serviceWorker.controller?.postMessage("CHECK_OFFLINE");

      navigator.serviceWorker.addEventListener("message", e=>{
        if(e.data && e.data.type==="OFFLINE_STATUS"){
          if(e.data.ready){
            setStatus("✓ 오프라인 실행 준비 완료");
          }else{
            setStatus("오프라인 캐시 일부 누락 · 새로고침 필요");
          }
        }
      });

      check();
      setTimeout(check,800);

    }catch(e){
      setStatus("오프라인 준비 실패: "+e.message);
      console.error("Service Worker error:",e);
    }
  });
}else{
  const status=document.getElementById("offlineStatus");
  if(status) status.textContent="이 브라우저는 오프라인 기능을 지원하지 않습니다.";
}</script>
